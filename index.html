<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091d30"><title>AQUARIA</title><style>*{box-sizing:border-box}body{margin:0;background:#071827;color:#e6f8ff;font-family:monospace}header,main,nav{max-width:650px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#74e4e6;letter-spacing:3px}button,input,select{font:inherit;border:2px solid #457e91;border-radius:7px;background:#112d43;color:white;padding:10px}button{cursor:pointer}button:active{transform:translateY(2px)}nav{display:flex;gap:8px}nav button{flex:1}section{background:#10283b;border:2px solid #31536a;border-radius:12px;padding:18px;margin:12px 0}.hidden{display:none}.tank{height:260px;position:relative;overflow:hidden;background:linear-gradient(#0d4c6c,#07364b);border:9px solid #456c80;border-radius:9px}.tank:after{content:"";position:absolute;bottom:0;left:0;right:0;height:25px;background:repeating-linear-gradient(90deg,#a88e66 0 12px,#c9a77b 12px 24px)}.fish{position:absolute;font-size:30px;animation:swim 8s ease-in-out infinite alternate;z-index:2}.fish:nth-child(2){top:35%;animation-duration:11s}.fish:nth-child(3){top:60%;animation-duration:6s}.plant{position:absolute;bottom:15px;font-size:46px;z-index:1}@keyframes swim{from{left:5%;transform:scaleX(1)}to{left:80%;transform:scaleX(-1)}}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1;min-width:110px}.muted{color:#a3c1cd}li{padding:6px}strong{color:#83e5e5}</style><header><h1>🐠 AQUARIA</h1><span>PIXEL AQUARIUM</span></header><nav><button onclick="tab('real')">📋 실제 어항</button><button onclick="tab('game')">🎮 가상 수족관</button></nav><main><div id="real"><section><h2>나의 실제 수족관</h2><p class="muted">기록은 이 기기 브라우저에 저장돼.</p><div class="row"><input id="tankName" placeholder="어항 이름"><input id="temp" type="number" step=".1" placeholder="수온 °C"><button onclick="saveTank()">어항 저장</button></div><p id="tankInfo"></p><button id="waterToggle" aria-expanded="false" onclick="toggleWater()">＋ 수질 기록 (선택)</button><div id="waterPanel" class="hidden"><p class="muted">수질 측정 도구가 있을 때만 기록해. 입력하지 않아도 돼.</p><div class="row"><input id="ph" type="number" step=".1" placeholder="pH"><input id="ammonia" type="number" step=".01" placeholder="암모니아 mg/L"><input id="nitrite" type="number" step=".01" placeholder="아질산염 mg/L"></div><button onclick="saveWater()">수질 기록 저장</button><p id="waterInfo" class="muted"></p><p id="waterHistory" class="muted"></p></div></section><section><h2>🐟 물고기 등록</h2><div class="row"><input id="species" placeholder="종류 (예: 구피)"><input id="count" type="number" min="1" value="1"><button onclick="addFish()">등록</button></div><ul id="fishList"></ul></section><section><h2>🗓️ 관리 일지</h2><div class="row"><select id="event"><option>먹이</option><option>환수</option><option>수질 검사</option><option>청소</option><option>기타</option></select><input id="memo" placeholder="메모"><button onclick="addLog()">기록</button></div><p id="waterChange" class="muted"></p><ul id="logs"></ul></section></div><div id="game" class="hidden"><section><h2>나만의 픽셀 바다</h2><p>🪙 코인: <strong id="coins"></strong> · 🐟 물고기: <strong id="population"></strong></p><div class="tank" id="scene"><span class="plant" style="left:9%">🌿</span><span class="plant" style="right:12%">🌱</span></div><div class="row"><button onclick="feed()">🍤 먹이 주기 (+5)</button><button onclick="buyFish()">🐟 물고기 구매 (20)</button><button onclick="buyPlant()">🌿 수초 구매 (10)</button></div><p id="notice" class="muted">먹이를 주고 코인을 모아봐!</p></section></div></main><script>const key='aquaria-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{name:'25큐브',temp:'',fish:[],logs:[],coins:20,virtual:2,plants:0}}catch(e){state={name:'25큐브',temp:'',fish:[],logs:[],coins:20,virtual:2,plants:0}}function save(){localStorage.setItem(key,JSON.stringify(state));render()}function tab(t){document.getElementById('real').classList.toggle('hidden',t!=='real');document.getElementById('game').classList.toggle('hidden',t!=='game')}function saveTank(){state.name=document.getElementById('tankName').value.trim()||'나의 어항';state.temp=document.getElementById('temp').value;save()}function toggleWater(){let p=document.getElementById("waterPanel"),b=document.getElementById("waterToggle");p.classList.toggle("hidden");let open=!p.classList.contains("hidden");b.textContent=open?"－ 수질 기록 닫기":"＋ 수질 기록 (선택)";b.setAttribute("aria-expanded",String(open))}function saveWater(){let ph=document.getElementById("ph").value,ammonia=document.getElementById("ammonia").value,nitrite=document.getElementById("nitrite").value;if([ph,ammonia,nitrite].every(v=>v===""))return alert("수질 수치를 입력해줘");if(ph!==""&&(Number(ph)<0||Number(ph)>14))return alert("pH는 0~14 사이로 입력해줘");if([ammonia,nitrite].some(v=>v!==""&&Number(v)<0))return alert("농도는 음수가 될 수 없어");state.water={ph,ammonia,nitrite,date:new Date().toLocaleString("ko-KR")};state.waterHistory=state.waterHistory||[];state.waterHistory.unshift({...state.water});state.waterHistory=state.waterHistory.slice(0,30);save()}function addFish(){const n=document.getElementById('species').value.trim(),c=Number(document.getElementById('count').value);if(!n||!Number.isInteger(c)||c<1)return alert('종류와 마릿수를 입력해줘');state.fish.push({n,c});document.getElementById('species').value='';save()}function addLog(){state.logs.unshift({date:new Date().toLocaleString('ko-KR'),timestamp:Date.now(),type:document.getElementById('event').value,memo:document.getElementById('memo').value.trim()});document.getElementById('memo').value='';save()}function feed(){state.coins+=5;document.getElementById('notice').textContent='냠냠! 물고기들이 맛있게 먹었어 🫧';save()}function buyFish(){if(state.coins<20)return alert('코인이 부족해');state.coins-=20;state.virtual++;save()}function buyPlant(){if(state.coins<10)return alert('코인이 부족해');state.coins-=10;state.plants++;save()}function render(){document.getElementById('tankInfo').textContent=state.name+' · '+(state.temp?state.temp+'°C':'수온 미기록');document.getElementById('tankName').value=state.name;let w=state.water||{};for(let id of ['ph','ammonia','nitrite'])document.getElementById(id).value=w[id]??'';document.getElementById('waterInfo').textContent=w.date?'최근 수질 ('+w.date+'): pH '+(w.ph||'—')+' · 암모니아 '+(w.ammonia||'—')+' mg/L · 아질산염 '+(w.nitrite||'—')+' mg/L':'수질 미기록';document.getElementById('waterHistory').textContent='수질 측정 횟수: '+(state.waterHistory||[]).length;document.getElementById('temp').value=state.temp;document.getElementById('fishList').replaceChildren(...state.fish.map((f,i)=>{let li=document.createElement('li');li.textContent=f.n+' × '+f.c+' ';let b=document.createElement('button');b.textContent='삭제';b.onclick=()=>{state.fish.splice(i,1);save()};li.append(b);return li}));let change=state.logs.find(x=>x.type==='환수');document.getElementById('waterChange').textContent=change?'마지막 환수: '+change.date+' ('+Math.max(0,Math.floor((Date.now()-new Date(change.timestamp||change.date).getTime())/86400000)||0)+'일 전)':'아직 환수 기록이 없어';document.getElementById('logs').replaceChildren(...state.logs.map(x=>{let li=document.createElement('li');li.textContent=x.date+' · '+x.type+' '+x.memo;return li}));document.getElementById('coins').textContent=state.coins;document.getElementById('population').textContent=state.virtual;const scene=document.getElementById('scene');scene.querySelectorAll('.fish,.extraPlant').forEach(x=>x.remove());for(let i=0;i<state.virtual;i++){let f=document.createElement('span');f.className='fish';f.textContent=['🐟','🐠','🐡'][i%3];f.style.top=(12+(i*23)%65)+'%';f.style.animationDelay=(-i*1.7)+'s';scene.append(f)}for(let i=0;i<state.plants;i++){let p=document.createElement('span');p.className='plant extraPlant';p.textContent='🌿';p.style.left=(20+(i*17)%70)+'%';scene.append(p)}}render();</script></html>
